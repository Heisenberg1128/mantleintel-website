name: Publish uploaded static build
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-static
      - name: Expand validated website
        run: |
          unzip -o mantleintel-static-v2.zip -d .published
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .published -exec rm -rf {} +
          cp -a .published/. .
          rm -rf .published mantleintel-static-v2.zip
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish revised Mantle website" || exit 0
          git push origin HEAD:hostinger-static
